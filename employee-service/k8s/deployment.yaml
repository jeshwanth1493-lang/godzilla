apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: employee-service

  template:
    metadata:
      labels:
        app: employee-service

    spec:
      containers:
        - name: employee-service
          image: jeshwanth1493/employee-service:latest

          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: employee-service-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employee-service-secret
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: employee-service-secret
                  key: JWT_SECRET

          imagePullPolicy: Always

          ports:
            - containerPort: 8080